<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortly - URL Shortener</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- ═══════════════════ NAVBAR ═══════════════════ -->
<nav class="navbar" id="navbar" style="display:none;">
    <div class="navbar-brand">Shortly</div>
    <div class="navbar-links">
        <a class="nav-link" href="#hero" onclick="goToHero(); return false;">Shorten</a>
        <a class="nav-link" href="#dashboard" onclick="goToDashboard(); return false;">Dashboard</a>
        <button class="nav-btn" onclick="openProfile()">Profile</button>
        <button class="nav-btn danger" onclick="logout()">Logout</button>
    </div>
</nav>

<!-- ═══════════════════ LOGIN PAGE ═══════════════════ -->
<section id="loginPage" class="page page-login">
    <div class="login-card">
        <div class="card-brand">
            <h1>Shortly</h1>
            <p>A simple way to shorten your web pages</p>
        </div>

        <h2>Sign in</h2>

        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <button type="button" id="togglePassword" aria-label="Toggle password visibility"></button>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <button type="button" class="btn-secondary" onclick="register()">Register</button>
            <div class="result" id="authResult"></div>
        </form>
    </div>
</section>

<!-- ═══════════════════ HERO PAGE ═══════════════════ -->
<section id="heroPage" class="page page-hero" style="display:none;">
    <div class="hero-content">
        <div class="hero-heading">
            <h1>Shortly</h1>
            <p>A simple way to shorten urls of your choice</p>
        </div>

        <div class="hero-form">
            <input type="url" id="urlInput" placeholder="https://example.com/very-long-url..." autocomplete="off">

            <div class="custom-input-wrapper" id="customInputWrapper" style="display:none;">
                <input type="text" id="customCodeInput" placeholder="Custom short code (max 10 chars)" autocomplete="off" maxlength="10">
                <button class="cross-btn" onclick="closeCustomInput()" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="hero-actions">
                <button class="btn-ghost" id="customBtn" onclick="toggleCustomInput()">Custom</button>
                <button class="btn-primary" id="generateBtn" onclick="shortenUrl()">Generate</button>
            </div>

            <div class="result" id="shortenResult"></div>
        </div>
    </div>
</section>

<!-- ═══════════════════ DASHBOARD PAGE ═══════════════════ -->
<section id="dashboardPage" class="page page-dashboard" style="display:none;">
    <div class="dashboard-content">
        <div class="dashboard-header">
            <h2>Your Links</h2>
            <span class="link-count" id="linkCount"></span>
        </div>
        <div class="history-grid" id="historyList"></div>
    </div>
</section>

<!-- ═══════════════════ PROFILE OVERLAY ═══════════════════ -->
<div id="profileOverlay" class="profile-overlay" onclick="closeProfile(event)">
    <div class="profile-panel" onclick="event.stopPropagation()">
        <div class="profile-header">
            <span class="back-btn" onclick="closeProfile()">&lt;</span>
            <h3 id="profileUsername"></h3>
        </div>
        <div class="profile-stats">
            <div class="stat-item">
                <p>Total Links</p>
                <h2 id="profileLinks"></h2>
            </div>
            <div class="stat-item">
                <p>Total Clicks</p>
                <h2 id="profileClicks"></h2>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
    function goToHero() {
        showPage('heroPage');
        history.pushState(null, '', '#hero');
    }

    function goToDashboard() {
        showPage('dashboardPage');
        history.pushState(null, '', '#dashboard');
        loadHistory();
    }

    function showPage(pageId) {
        ['heroPage', 'dashboardPage'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
        document.getElementById(pageId).style.display = 'flex';
    }

    window.addEventListener('popstate', function() {
        const hash = window.location.hash;
        if (hash === '#dashboard') {
            showPage('dashboardPage');
            loadHistory();
        } else {
            showPage('heroPage');
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        checkAuthStatus();
    });
</script>
</body>
</html>
