<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortly - URL Shortener</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="hero">
    <h1><i class="fas fa-link" style="margin-right: 10px;"></i>Shortly</h1>
    
    <div class="hero-actions">
        <button onclick="openProfile()">Profile</button>
        <button id="logoutBtn" onclick="logout()" style="display:none;">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</div>

<!-- AUTH SECTION -->
<div class="container" id="authSection" style="display: flex;">
    <div class="section expanded">
        <h2><i class="fas fa-user-lock"></i> Login / Register</h2>

        <form id="authForm">
            <input
                type="text"
                id="username"
                placeholder="Username"
                required
                autocomplete="username"
            >

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                    autocomplete="current-password"
                >
                <button
                    type="button"
                    id="togglePassword"
                    aria-label="Toggle password visibility"
                >
                    <!-- Icon will be added by JavaScript -->
                </button>
            </div>

            <button type="submit">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <button type="button" onclick="register()">
                <i class="fas fa-user-plus"></i> Register
            </button>

            <div class="result" id="authResult"></div>
        </form>
    </div>
</div>

<!-- APP SECTION -->
<div class="container" id="appSection" style="display:none;">
<!-- SHORTEN -->
<div class="section expanded">
    <h2><i class="fas fa-compress-alt"></i> Shorten URL</h2>

    <input
        type="url"
        id="urlInput"
        placeholder="https://example.com/very-long-url..."
        autocomplete="off"
    >

    <!-- Custom input area with cross button -->
    <div class="custom-input-wrapper" id="customInputWrapper" style="display: none;">
        <input
            type="text"
            id="customCodeInput"
            placeholder="Enter custom short code (alphanumeric, max 10 chars)"
            autocomplete="off"
            maxlength="10"
        >
        <button class="cross-btn" onclick="closeCustomInput()" aria-label="Close custom input">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="shorten-actions">
        <button class="secondary-btn" id="customBtn" onclick="toggleCustomInput()">
            <i class="fas fa-pen"></i> Custom
        </button>

        <button class="primary-btn" id="generateBtn" onclick="shortenUrl()">
            <i class="fas fa-magic"></i> Generate
        </button>
    </div>

    <div class="result" id="shortenResult"></div>
</div>
    <!-- HISTORY -->
    <div class="section expanded history">
        <h2><i class="fas fa-history"></i> Your Links</h2>

        <div class="history-list" id="historyList">
            <!-- Cards injected by JS -->
        </div>
    </div>
</div>

<!-- PROFILE OVERLAY -->
<div id="profileOverlay" class="profile-overlay" onclick="closeProfile(event)">
    <div class="profile-panel" onclick="event.stopPropagation()">

        <div class="profile-header">
            <span class="back-btn" onclick="closeProfile()">&lt;</span>
            <h3 id="profileUsername"></h3>
        </div>

        <div class="profile-stats">
            <div class="stat-item">
                <p>Total Links</p>
                <h2 id="profileLinks"></h2>
            </div>

            <div class="stat-item">
                <p>Total Clicks</p>
                <h2 id="profileClicks"></h2>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
<script>
    // Check if user is already logged in when page loads
    document.addEventListener('DOMContentLoaded', function() {
        checkAuthStatus();
    });
</script>

</body>
</html>
